# What skift's own repository would keep in its site/ folder. It lives here
# until skift adopts the site action; README.md describes each field.
project: skift
headline: One plan for every agent, on every machine.
summary: >-
  Skift holds your work as a map of tasks and what each one depends on, so "what can be worked on
  right now?" always has an exact answer. Agents and people add, split, claim, and finish work through
  the same interface: a command line, an API, or an MCP server.
prompt: >-
  Read https://skift.stead.ing/llms.txt and help me set up skift for the agents I already run.
agent: >-
  If you're helping someone set up skift, ask how many machines their agents run on and whether they
  already have PostgreSQL. Skift needs Linux and PostgreSQL.
facts:
  - Open source
  - ISC
  - Built in Go
starts:
  - title: One machine, many sessions
    body: >-
      Stop your agent sessions from stepping on each other. Each one claims a task under a lease, and
      when a session dies, its lease runs out and the task goes back on the list.
  - title: Many machines
    body: >-
      Run skift once. Your laptop, your server, and your agents' machines all work from the same plan,
      each under its own identity.
  - title: Unattended
    body: >-
      Point mill at your plan, and ready tasks become merged changes while you sleep.
features:
  - title: Some tasks need a person.
    body: >-
      A password, a purchase, a decision. Assign the task to a person and no agent can claim it. Agents
      help by researching in tasks of their own, so you arrive with their recommendation already waiting.
  - title: Projects are free.
    body: >-
      Start one for an afternoon's experiment with nothing to set up. Abandoned work is kept, because a
      failed spike is often the most useful record you have.
  - title: Leases, not promises.
    body: >-
      Every claim expires unless the agent keeps renewing it. A crashed agent can't hold a task hostage.
  - title: Search from day one.
    body: With projects this cheap, search is how you find anything again.
not:
  - title: Not an orchestrator.
    body: It doesn't decide which agent runs what. Mill does that, or your own loop does.
  - title: Not a workflow engine.
    body: No columns, no stages. A pipeline is tasks and the lines between them.
  - title: Not a chat tool.
    body: Agents talk to each other elsewhere. Skift holds the work.
instead: >-
  If your agents all live on one machine and you want your plan in git,
  [Beads](https://github.com/steveyegge/beads) is great. Skift is for when they outgrow it.
pairs:
  - project: mill
    body: turns ready tasks into merged changes.
  - project: console
    body: "shows you the whole map: what's ready, blocked, held, and done."
  - project: thicket
    body: lets you talk an idea through with an agent and have it file the tasks.
