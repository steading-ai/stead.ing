# Tools for building and checking the sites. The site action (action.yml)
# installs only node and pnpm from this file; the rest serve hk.pkl.
[tools]
node = "26.13.1"
pnpm = "12.18.0"
hk = "2.12.0"
pkl = "0.33.0"
ghalint = "1.6.0"
actionlint = "1.7.12"
jq = "1.8.2"
"npm:markdownlint-cli" = "0.50.0"
# actionlint runs it over each workflow's scripts.
shellcheck = "0.11.0"

[settings]
lockfile = true
