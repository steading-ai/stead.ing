# A made-up skift site that exercises every field and every kind of link.
project: skift
headline: A fixture headline.
summary: A fixture summary with "quotes" and <angle brackets>.
fit: Fixture facts about who the project suits.
install:
  command: sudo dnf install skift
  note: Needs `PostgreSQL`. See [the guide](/docs/guide/).
facts: [Open source, ISC]
demo:
  title: A fixture plan
  nodes:
    - ref: "#1"
      title: The first thing
      kind: task
      priority: p1
      state: done
      who: an agent
      note: It is finished.
    - ref: "#2"
      title: The second thing
      kind: bug
      priority: p0
      state: ready
      who: any agent
      note: Nothing it waits on is open.
      waits: ["#1"]
    - ref: "#3"
      title: A question
      kind: task
      priority: p2
      state: needs-you
      who: a person
      note: Only a person can do it.
    - ref: "#4"
      title: The last thing
      kind: chore
      priority: p3
      state: blocked
      who: any agent
      note: It waits on two others.
      waits: ["#2", "#3"]
run:
  title: A fixture run
  work:
    ref: "#2"
    title: The second thing
  workflow: fixture-flow
  steps:
    - name: write
      kind: agent session
      state: closed
      who: an agent
      closes: A commit that exists
      proof: 3f9c2ab
      note: The commit was looked up, not taken on trust.
    - name: test
      kind: command
      state: running
      who: the runner
      closes: An exit code of 0
      note: A command with an exit code.
    - name: approve
      kind: gate
      state: needs-you
      who: a person
      closes: A yes from a person
      note: Only a person can close it.
    - name: merge
      kind: command
      state: open
      who: the runner
      closes: The change on the default branch
      note: It has not started.
video:
  caption: A fixture demonstration.
offers:
  title: What the fixture holds
  items:
    - title: A thing.
      body: It holds something.
thinking:
  title: How the fixture thinks
  items:
    - title: An idea
      body: It thinks *something*.
      href: /docs/reference/
quickstart:
  title: Run your first fixture
  steps:
    - title: Set it up
      body: Paste this into your agent.
      prompt: true
    - title: Run it
      body: Do the **first** thing.
      code: skift ready
    - title: Use it
      body: Do the next thing.
starts:
  - title: First start
    body: Start here.
not:
  - title: Not a runner.
    body: It runs nothing.
    use: mill
  - title: Not a thing with nothing to use.
    body: It isn't that.
instead: Built for [something](https://example.com/) *first*.
pairs:
  - project: mill
    body: pairs with it.
  - project: thicket
    body: talks to it.
docs:
  order: [reference]
  sections:
    - title: Using it
      pages: [guide/]
    - title: Building it
      collapsed: true
      pages:
        - reference: Commands
        - adrs/
  exclude:
    - docs/adrs/000-template.md
    - docs/drafts/
