name: Steading site
description: Build a Steading project's site from a folder of Markdown and a site.yaml, and publish it to GitHub Pages.

inputs:
  content:
    description: Folder in the calling repository that holds site.yaml and the pages.
    default: site
  deploy:
    description: Publish to GitHub Pages. Set to "false" to build only, as a pull request check.
    default: "true"

outputs:
  url:
    description: Address of the published site. Empty when deploy is "false".
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: composite
  steps:
    # The site's code and its pinned tools live beside this file, not in the calling repository.
    - name: Install node and pnpm
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      with:
        working_directory: ${{ github.action_path }}
        install_args: node pnpm

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Build the site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        STEADING_CONTENT: ${{ github.workspace }}/${{ inputs.content }}
        STEADING_OUT: ${{ runner.temp }}/steading-site
        STEADING_EDIT_BASE: ${{ github.server_url }}/${{ github.repository }}/edit/${{ github.event.repository.default_branch }}/${{ inputs.content }}
      run: pnpm build

    - name: Upload the site
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      with:
        path: ${{ runner.temp }}/steading-site

    - name: Publish to GitHub Pages
      id: deploy
      if: inputs.deploy == 'true'
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
