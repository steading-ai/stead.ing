name: Steading site
description: Build a Steading project's site from its site.yaml, README and docs folder, and publish it to GitHub Pages.

inputs:
  content:
    description: Folder in the calling repository that holds site.yaml, README.md and docs/. The repository itself, unless the project lives in a subfolder.
    default: .
  deploy:
    description: Publish to GitHub Pages. Set to "false" to build only, as a pull request check.
    default: "true"

outputs:
  url:
    description: Address of the published site. Empty when deploy is "false".
    value: ${{ steps.deploy.outputs.page_url }}

runs:
  using: composite
  steps:
    # The site's code and its pinned tools live beside this file, not in the calling repository.
    - name: Install node and pnpm
      uses: jdx/mise-action@v5.2.7
      with:
        working_directory: ${{ github.action_path }}
        install_args: node pnpm
        # This action publishes, so it restores no cache entry that another run could have planted.
        cache: false

    - name: Install dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile

    - name: Build the site
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        STEADING_CONTENT: ${{ github.workspace }}/${{ inputs.content }}
        STEADING_OUT: ${{ runner.temp }}/steading-site
        STEADING_EDIT_BASE: ${{ github.server_url }}/${{ github.repository }}/edit/${{ github.event.repository.default_branch }}${{ inputs.content != '.' && format('/{0}', inputs.content) || '' }}
      run: pnpm build

    - name: Upload the site
      if: inputs.deploy == 'true'
      uses: actions/upload-pages-artifact@v5.0.0
      with:
        path: ${{ runner.temp }}/steading-site

    - name: Publish to GitHub Pages
      id: deploy
      if: inputs.deploy == 'true'
      uses: actions/deploy-pages@v5.0.1
